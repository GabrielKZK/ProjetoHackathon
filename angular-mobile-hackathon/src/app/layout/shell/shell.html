<div class="operador-shell">
  <header class="topo">
    <div class="topo-marca">
      <span class="logo">G</span>
      <div>
        <div class="topo-titulo">GOLLINHO WMS</div>
        @if (operador.docaAtual(); as doca) {
          <div class="topo-doca">{{ doca.descricao }}</div>
        } @else {
          <div class="topo-doca fraca">Operador</div>
        }
      </div>
    </div>

    <div class="topo-usuario">
      <a href="http://localhost:4200" class="link-gerenciador" title="Abrir o gerenciador (angular-hackathon, outra aba)">🖥</a>
      <span>{{ auth.nome() }}</span>
      <button type="button" class="secundario" (click)="sair()">Sair</button>
    </div>
  </header>

  <main class="conteudo-operador">
    <router-outlet />
  </main>
</div>
