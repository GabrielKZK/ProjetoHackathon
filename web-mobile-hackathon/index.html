<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Gollinho WMS — Login</title>
  <meta name="theme-color" content="#0d1014" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gollinho WMS" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app-shell d-flex flex-column justify-content-center" style="min-height:100vh;">

    <div class="text-center mb-4">
      <div class="logo-gollinho">GOLLINHO<span>WMS</span></div>
      <p class="text-body-secondary mb-0">Conferência e armazenagem — chão de fábrica</p>
    </div>

    <form id="form-login" class="card p-4" novalidate>
      <div class="mb-3">
        <label for="login" class="form-label">Usuário</label>
        <input type="text" id="login" class="form-control" placeholder="operador" autocomplete="username" required />
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" id="senha" class="form-control" placeholder="••••" autocomplete="current-password" required />
      </div>

      <div id="erro-login" class="d-none mb-3"></div>

      <button type="submit" class="btn btn-primary touch-btn w-100">Entrar</button>

      <p class="text-center text-body-secondary mt-3 mb-0" style="font-size:.85rem;">
        Usuário de teste: <span class="mono">operador</span> / <span class="mono">123</span>
      </p>
    </form>

    <p class="text-center text-body-secondary mt-4 mb-0" style="font-size:.75rem;">
      Modo offline (dados de teste) ativo — desligue em <span class="mono">assets/js/config.js</span>
    </p>
  </div>

  <div id="carregando" class="d-none">
    <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // já logado? pula direto pro fluxo
    if (Sessao.obterUsuario()) window.location.href = 'docas.html';

    document.getElementById('form-login').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      limparInline('erro-login');
      const login = document.getElementById('login').value.trim();
      const senha = document.getElementById('senha').value;

      if (!login || !senha) {
        mostrarErroInline('erro-login', { mensagem: 'Preencha usuário e senha.' });
        return;
      }

      mostrarCarregando(true);
      try {
        const usuario = await Api.login(login, senha);
        Sessao.salvarUsuario(usuario);
        window.location.href = 'docas.html';
      } catch (erro) {
        mostrarErroInline('erro-login', erro);
      } finally {
        mostrarCarregando(false);
      }
    });
  </script>
</body>
</html>
