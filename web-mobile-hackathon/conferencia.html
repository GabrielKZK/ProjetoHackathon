<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Gollinho WMS — Conferência</title>
  <meta name="theme-color" content="#0d1014" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="topbar"></div>

    <h1 class="h4 mb-1" id="titulo-nota">Conferência cega</h1>
    <p class="text-body-secondary mb-1" id="subtitulo-nota"></p>
    <div class="alert alert-warning py-2 mb-3" style="font-size:.85rem;">
      🙈 A quantidade da nota fiscal não é exibida. Conte fisicamente e digite o que encontrou.
    </div>

    <div id="erro-conferencia" class="d-none mb-3"></div>

    <form id="form-conferencia">
      <div id="itens-conferencia"></div>

      <div id="bloco-observacao" class="d-none mt-2 mb-3">
        <label for="observacao" class="form-label">Observação da divergência (obrigatória)</label>
        <textarea id="observacao" class="form-control" rows="3" placeholder="Ex.: faltaram 2 fardos, caixa avariada..."></textarea>
      </div>

      <button type="submit" id="btn-confirmar" class="btn btn-primary touch-btn w-100 mt-2">Confirmar contagem</button>
    </form>
  </div>

  <div id="carregando" class="d-none">
    <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    if (!exigirLogin()) { /* redirecionado */ }
    const doca = exigirDoca();
    const notaId = Sessao.obterNotaId();
    if (doca && !notaId) window.location.href = 'notas.html';
    if (doca) montarTopbar({ titulo: 'Conferência cega', voltarPara: 'notas.html' });

    let nota = null;
    let precisaObservacao = false;

    async function carregarNota() {
      if (!doca || !notaId) return;
      mostrarCarregando(true);
      try {
        nota = await Api.buscarNota(notaId);
        document.getElementById('titulo-nota').textContent = `NF ${nota.numero}/${nota.serie}`;
        document.getElementById('subtitulo-nota').textContent = `${nota.fornecedor} — ${formatarData(nota.dataEmissao)}`;

        const alvo = document.getElementById('itens-conferencia');
        alvo.innerHTML = nota.itens.map((item, i) => `
          <div class="card p-3 mb-3">
            <label class="form-label" for="fardos-${i}">${escaparHtml(item.produto.sabor)} — fardos contados</label>
            <input type="number" id="fardos-${i}" class="form-control" min="0" inputmode="numeric" placeholder="0" required />
          </div>
        `).join('');
      } catch (erro) {
        mostrarErroInline('erro-conferencia', erro);
      } finally {
        mostrarCarregando(false);
      }
    }
    carregarNota();

    document.getElementById('form-conferencia').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      limparInline('erro-conferencia');
      if (!nota) return;

      const itens = nota.itens.map((item, i) => ({
        produtoId: item.produto.id,
        fardosConferidos: Number(document.getElementById(`fardos-${i}`).value || 0),
      }));

      if (precisaObservacao) {
        const observacao = document.getElementById('observacao').value.trim();
        if (!observacao) {
          mostrarErroInline('erro-conferencia', { mensagem: 'A observação é obrigatória quando a contagem diverge.' });
          return;
        }
      }

      const observacaoAtual = precisaObservacao ? document.getElementById('observacao').value.trim() : null;

      mostrarCarregando(true);
      try {
        const resultado = await Api.conferir(nota.id, itens, observacaoAtual);

        if (resultado.precisaObservacao) {
          precisaObservacao = true;
          document.getElementById('bloco-observacao').classList.remove('d-none');
          document.getElementById('btn-confirmar').textContent = 'Reenviar com observação';
          mostrarErroInline('erro-conferencia', {
            mensagem: 'A contagem não bateu com o esperado. Registre uma observação para confirmar mesmo assim.',
          });
          return;
        }

        const qtd = resultado.paletesGerados.length;
        const codigos = resultado.paletesGerados.map((p) => p.codigo).join(', ');

        mostrarAlertaCheio({
          tipo: resultado.status === 'CONFERIDA' ? 'sucesso' : 'aviso',
          titulo: resultado.status === 'CONFERIDA' ? 'Conferência batida!' : 'Registrada como divergente',
          mensagem: `${qtd} palete(s) gerado(s): ${codigos || '—'}. Agora é só armazenar.`,
          textoBotao: 'Ir para paletes',
          aoFechar: () => { window.location.href = 'paletes.html'; },
        });
      } catch (erro) {
        mostrarErroInline('erro-conferencia', erro);
      } finally {
        mostrarCarregando(false);
      }
    });
  </script>
</body>
</html>
