<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Gollinho WMS — Docas</title>
  <meta name="theme-color" content="#0d1014" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="topbar"></div>

    <h1 class="h4 mb-1">Selecione a doca</h1>
    <p class="text-body-secondary mb-3">Onde a carga está sendo recebida agora?</p>

    <div id="erro-docas" class="d-none mb-3"></div>
    <div id="grade-docas" class="grade-botoes grade-doca grade-2"></div>
  </div>

  <div id="carregando" class="d-none">
    <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    if (!exigirLogin()) { /* redirecionado */ }
    sessionStorage.removeItem('gollinho_doca');
    montarTopbar({ titulo: 'Gollinho WMS' });

    async function carregarDocas() {
      mostrarCarregando(true);
      limparInline('erro-docas');
      try {
        const docas = await Api.listarDocas();
        const grade = document.getElementById('grade-docas');
        grade.innerHTML = docas.map((doca) => `
          <button type="button" class="btn btn-outline-primary touch-btn" data-id="${doca.id}">
            🚛<br>${escaparHtml(doca.descricao)}
          </button>
        `).join('');

        grade.querySelectorAll('button').forEach((btn) => {
          btn.addEventListener('click', () => {
            const doca = docas.find((d) => d.id === Number(btn.dataset.id));
            Sessao.salvarDoca(doca);
            window.location.href = 'notas.html';
          });
        });
      } catch (erro) {
        mostrarErroInline('erro-docas', erro);
      } finally {
        mostrarCarregando(false);
      }
    }
    carregarDocas();
  </script>
</body>
</html>
