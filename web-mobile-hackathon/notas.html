<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Gollinho WMS — Notas fiscais</title>
  <meta name="theme-color" content="#0d1014" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="topbar"></div>

    <h1 class="h4 mb-1">Notas aguardando conferência</h1>
    <p class="text-body-secondary mb-3">Toque numa nota para iniciar a conferência cega.</p>

    <div id="erro-notas" class="d-none mb-3"></div>
    <div id="lista-notas"></div>

    <a href="paletes.html" class="btn btn-outline-light touch-btn w-100 mt-4">📦 Ver paletes em doca (armazenagem)</a>
  </div>

  <div id="carregando" class="d-none">
    <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    if (!exigirLogin()) { /* redirecionado */ }
    const doca = exigirDoca();
    if (doca) montarTopbar({ titulo: 'Notas fiscais', voltarPara: 'docas.html' });

    async function carregarNotas() {
      if (!doca) return;
      mostrarCarregando(true);
      limparInline('erro-notas');
      try {
        const notas = await Api.listarNotas(doca.id, 'AGUARDANDO_CONFERENCIA');
        const lista = document.getElementById('lista-notas');

        if (notas.length === 0) {
          lista.innerHTML = `
            <div class="vazio">
              <span class="vazio-icone">✅</span>
              Nenhuma nota aguardando conferência nesta doca.
            </div>`;
          return;
        }

        lista.innerHTML = notas.map((nota) => `
          <div class="card card-nota p-3 mb-3" data-id="${nota.id}">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="mono" style="font-size:1.1rem;font-weight:700;">NF ${escaparHtml(nota.numero)}/${escaparHtml(nota.serie)}</div>
                <div class="text-body-secondary">${escaparHtml(nota.fornecedor)}</div>
                <div class="text-body-secondary" style="font-size:.85rem;">${formatarData(nota.dataEmissao)} · ${nota.itens.length} sabor(es)</div>
              </div>
              ${badgeStatusNota(nota.status)}
            </div>
          </div>
        `).join('');

        lista.querySelectorAll('.card-nota').forEach((card) => {
          card.addEventListener('click', () => {
            Sessao.salvarNotaId(card.dataset.id);
            window.location.href = 'conferencia.html';
          });
        });
      } catch (erro) {
        mostrarErroInline('erro-notas', erro);
      } finally {
        mostrarCarregando(false);
      }
    }
    carregarNotas();
  </script>
</body>
</html>
