<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Gollinho WMS — Paletes em doca</title>
  <meta name="theme-color" content="#0d1014" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="topbar"></div>

    <h1 class="h4 mb-1">Paletes em doca</h1>
    <p class="text-body-secondary mb-3">Toque num palete para armazená-lo numa posição livre.</p>

    <div id="erro-paletes" class="d-none mb-3"></div>
    <div id="lista-paletes"></div>
  </div>

  <div id="carregando" class="d-none">
    <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    if (!exigirLogin()) { /* redirecionado */ }
    const doca = exigirDoca();
    if (doca) montarTopbar({ titulo: 'Paletes em doca', voltarPara: 'notas.html' });

    async function carregarPaletes() {
      if (!doca) return;
      mostrarCarregando(true);
      limparInline('erro-paletes');
      try {
        const paletes = await Api.listarPaletes(doca.id, 'EM_DOCA');
        const lista = document.getElementById('lista-paletes');

        if (paletes.length === 0) {
          lista.innerHTML = `
            <div class="vazio">
              <span class="vazio-icone">📦</span>
              Nenhum palete aguardando armazenagem nesta doca.<br>
              Confira uma nota fiscal primeiro.
            </div>`;
          return;
        }

        lista.innerHTML = paletes.map((palete) => `
          <div class="card card-palete p-3 mb-3" data-id="${palete.id}">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <div class="mono" style="font-size:1.1rem;font-weight:700;">${escaparHtml(palete.codigo)}</div>
                <div class="text-body-secondary">${escaparHtml(palete.produto.sabor)}</div>
                <div class="text-body-secondary" style="font-size:.85rem;">
                  ${palete.fardos} fardos · ${palete.garrafas} garrafas · ${palete.litros} L
                  ${palete.parcial ? ' · <span class="badge bg-warning text-dark">parcial</span>' : ''}
                </div>
              </div>
              <button type="button" class="btn btn-primary touch-btn">Armazenar</button>
            </div>
          </div>
        `).join('');

        lista.querySelectorAll('.card-palete').forEach((card) => {
          card.addEventListener('click', () => {
            Sessao.salvarPaleteId(card.dataset.id);
            window.location.href = 'armazenagem.html';
          });
        });
      } catch (erro) {
        mostrarErroInline('erro-paletes', erro);
      } finally {
        mostrarCarregando(false);
      }
    }
    carregarPaletes();
  </script>
</body>
</html>
